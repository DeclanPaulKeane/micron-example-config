apiVersion: apps/v1
kind: Deployment
metadata: {name: chaos-proxy, namespace: micron-aigw}
spec:
  replicas: 1
  selector: {matchLabels: {app: chaos-proxy}}
  template:
    metadata: {labels: {app: chaos-proxy}}
    spec:
      containers:
      - name: proxy
        image: python:3.12-slim
        command: ["sh", "-c", "pip install -q aiohttp && python /app/app.py"]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
        readinessProbe: {httpGet: {path: /admin/state, port: 8080}, initialDelaySeconds: 15}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: chaos-proxy-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: chaos-proxy, namespace: micron-aigw}
spec:
  selector: {app: chaos-proxy}
  ports: [{name: http, port: 80, targetPort: 8080}]
