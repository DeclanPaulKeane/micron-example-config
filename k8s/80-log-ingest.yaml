apiVersion: apps/v1
kind: Deployment
metadata: {name: log-ingest, namespace: micron-aigw}
spec:
  replicas: 1
  selector: {matchLabels: {app: log-ingest}}
  template:
    metadata: {labels: {app: log-ingest}}
    spec:
      containers:
      - name: ingest
        image: python:3.12-slim
        command: ["python", "/app/app.py"]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 192Mi}}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: log-ingest-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: log-ingest, namespace: micron-aigw}
spec:
  selector: {app: log-ingest}
  ports: [{name: http, port: 80, targetPort: 8080}]
