apiVersion: apps/v1
kind: Deployment
metadata: {name: budget-watcher, namespace: micron-aigw}
spec:
  replicas: 1
  selector: {matchLabels: {app: budget-watcher}}
  template:
    metadata: {labels: {app: budget-watcher}}
    spec:
      containers:
      - name: watcher
        image: python:3.12-slim
        command: ["sh", "-c", "pip install -q redis && python /app/app.py"]
        env:
        - {name: REDIS_HOST, value: redis}
        - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: micron-secrets, key: REDIS_PASSWORD}}}
        - {name: PAT, valueFrom: {secretKeyRef: {name: micron-secrets, key: PAT}}}
        - {name: GW_ID, valueFrom: {configMapKeyRef: {name: micron-config, key: GW_ID}}}
        - {name: TEAMS_WEBHOOK_URL, valueFrom: {secretKeyRef: {name: micron-secrets, key: TEAMS_WEBHOOK_URL, optional: true}}}
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 15}
        volumeMounts: [{name: app, mountPath: /app}, {name: cfg, mountPath: /config}]
      volumes:
      - {name: app, configMap: {name: budget-watcher-app}}
      - {name: cfg, configMap: {name: budget-watcher-config}}
---
apiVersion: v1
kind: Service
metadata:
  name: budget-watcher
  namespace: micron-aigw
  annotations: {cloud.google.com/neg: '{"ingress": true}'}
spec:
  selector: {app: budget-watcher}
  ports: [{name: http, port: 80, targetPort: 8080}]
